<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>SKILLBRIDGE Ethiopia</title>
    <meta name="description" content="AI-Powered Platform for Skill-Based Job Matching, Skill-Gap Analysis, and Employer Performance Evaluation in Ethiopia." />
    <meta property="og:title" content="SKILLBRIDGE Ethiopia" />
    <meta property="og:description" content="AI-Powered Platform for Skill-Based Job Matching, Skill-Gap Analysis, and Employer Performance Evaluation in Ethiopia." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var path = window.location.pathname;
          var scope = path === '/dashboard/seeker' ? 'job-seeker'
            : path === '/dashboard/employer' ? 'employer'
              : path === '/admin' ? 'admin'
                : 'public';
          var scopedKey = 'skillbridge-theme-' + scope;
          var stored = localStorage.getItem(scopedKey)
            || localStorage.getItem('skillbridge_theme')
            || localStorage.getItem('skillbridge_atmos_theme')
            || localStorage.getItem('skillbridge_atmos_mode');
          var isDarkOS = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'dark' || ((stored !== 'light' && stored !== 'dark') && isDarkOS) ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-theme-scope', scope);
          root.style.colorScheme = theme;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#ffffff');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
