name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: skillbridge_test
          MYSQL_USER: skillbridge
          MYSQL_PASSWORD: skillbridge-local
          MYSQL_ROOT_PASSWORD: local-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=skillbridge --password=skillbridge-local"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build:server
      - name: Run MySQL integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: mysql://skillbridge:skillbridge-local@127.0.0.1:3306/skillbridge_test
          TEST_DATABASE_URL: mysql://skillbridge:skillbridge-local@127.0.0.1:3306/skillbridge_test
          JWT_SECRET: ci-only-secret-at-least-32-characters
