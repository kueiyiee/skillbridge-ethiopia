services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: skillbridge_test
      MYSQL_USER: skillbridge
      MYSQL_PASSWORD: skillbridge-local
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--user=skillbridge", "--password=skillbridge-local"]
      interval: 5s
      timeout: 5s
      retries: 20
